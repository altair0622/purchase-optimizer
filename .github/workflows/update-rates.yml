name: Update portal rates

on:
  schedule:
    - cron: '17 14 * * *'   # 매일 14:17 UTC (미 동부 오전) — Rakuten 공개 기본율 갱신
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape Rakuten public rates
        run: node scripts/update-rates.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet rates.json; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates.json
            git commit -m "chore: update portal rates ($(date -u +%F))"
            git push
          fi
